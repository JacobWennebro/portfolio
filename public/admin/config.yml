local_backend: true

backend:
  name: github
  repo: jacobwennebro/portfolio
  branch: main
  base_url: https://www.wennebro.com
  auth_endpoint: /api/auth

media_folder: src/assets/uploads
public_folder: ../../assets/uploads

collections:
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: albums
    label: Albums
    folder: src/content/albums
    create: true
    nested: { depth: 2 }
    identifier_field: name
    slug: "{{countrySlug}}/{{slug}}-{{date}}"
    media_folder: ../../../assets/uploads
    public_folder: ../../../assets/uploads
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Country, name: country, widget: string, hint: "ISO 3166-1 alpha-2 code (e.g. SK, IT, JP)" }
      - { label: Country Slug, name: countrySlug, widget: hidden }
      - { label: Date, name: date, widget: datetime, format: "MMMM YYYY", date_format: "MMMM YYYY", time_format: false }
      - label: Images
        name: images
        widget: list
        fields:
          - { label: Photo, name: src, widget: image }
          - { label: Caption, name: caption, widget: string, required: false }
          - { label: Alt text, name: alt, widget: string, required: true, hint: "Describe what's in the photo for screen readers" }
      - { label: Body, name: body, widget: markdown, required: false }
